<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>즐겨찾기 목록</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

</head>
<body>
	<div class="container">
		<h1>즐겨찾기 목록</h1>
		<table class="table">
			<thead>
				<tr>
					<th>NO.</th>
					<th>이름</th>
					<th>주소</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="favorite,status : ${favoriteList}">
					<td th:text="${status.count}"></td>
					<td th:text="${favorite.name}"></td>
					<td><a th:href="${favorite.url}" th:text="${favorite.url}"
						target="_blank" rel="noopener noreferrer"></a></td>
					<td><button type="button" th:value="${favorite.id}"
							class="btn btn-danger btn-sm delete-btn">삭제</button></td>
				</tr>
			</tbody>
		</table>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.js"></script>

	<script>
		$(".delete-btn").on("click", function() {
			let id = $(this).val();
			let button = $(this); // 해당 버튼 요소 저장

			$.ajax({
				type : "get",
				url : "/ajax/favorite/delete",
				data : {
					"id" : id
				},
				success : function(response) {
					if (response.result === "success") {
						location.reload(); //새로고침이 필요가 없음

					} else {
						alert("삭제 실패");
					}
				},
				error : function() {
					alert("삭제 에러");
				}
			});
		});
	</script>

</body>
</html>
