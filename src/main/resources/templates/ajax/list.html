<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>즐겨찾기 목록</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>
body {
	background: #f0f4f8;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	color: #333;
}

.container {
	margin-top: 50px;
	background: white;
	padding: 30px;
	border-radius: 12px;
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

h1 {
	text-align: center;
	margin-bottom: 30px;
	color: #007bff;
	font-weight: 700;
	letter-spacing: 1.2px;
}

table {
	border-radius: 10px;
	overflow: hidden;
	box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

thead {
	background-color: #007bff;
	color: white;
	font-weight: 600;
}

tbody tr:hover {
	background-color: #e9f2ff;
	transition: background-color 0.3s ease;
}

td, th {
	text-align: center !important;
	vertical-align: middle !important;
	font-size: 16px;
}
</style>

</head>
<body>
	<div class="container">
		<h1>즐겨찾기 목록</h1>
		<table class="table">
			<thead>
				<tr>
					<th>NO.</th>
					<th>이름</th>
					<th>주소</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="favorite,status : ${favoriteList}">
					<td th:text="${status.count}"></td>
					<td th:text="${favorite.name}"></td>
					<td><a th:href="${favorite.url}" th:text="${favorite.url}"
						target="_blank" rel="noopener noreferrer"></a></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
