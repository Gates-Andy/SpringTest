<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>즐겨찾기 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

</head>
<body>
	<div class="container">
		<h1>즐겨찾기 목록</h1>
		<table class="table">
			<thead>
				<tr>
					<th>NO.</th>
					<th>이름</th>
					<th>주소</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="favorite,status : ${favoriteList}">
					<td th:text="${status.count}"></td>
					<td th:text="${favorite.name}"></td>
					<td><a th:href="${favorite.url}" th:text="${favorite.url}"
						target="_blank" rel="noopener noreferrer"></a></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
