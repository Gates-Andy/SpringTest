<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>통나무 팬션</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<style>
html, body {
	height: 100%;
	margin: 0;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	background-color: #f4f4f4;
}

#wrap {
	min-height: 100vh;
	display: flex;
	flex-direction: column;
	max-width: 1200px;
	margin: 0 auto;
	background-color: #ffffff;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

header {
	height: 100px;
	background-color: #6b4f29;
	color: white;
	display: flex;
	justify-content: center;
	align-items: center;
	font-size: 2.5rem;
	font-weight: bold;
}

nav {
	height: 50px;
	background-color: #a0522d;
}

nav a {
	color: white !important;
	font-weight: bold;
}

.main-contents {
	flex: 1;
	padding: 40px;
	display: flex;
	justify-content: center;
	align-items: center;
}

.contents {
	background-color: #f8f9fa;
	padding: 30px;
	border-radius: 10px;
	width: 100%;
	max-width: 500px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

footer {
	background-color: #eee;
	padding: 20px;
	font-size: 0.9rem;
	color: #555;
}
</style>

</head>
<body>
	<div id="wrap">
		<header class="justify-content-center align-items-center">
			<div class="display-4">통나무 팬션</div>
		</header>
		<section>
			<nav class="main-menu">
				<div class="mt-3">
					<ul class="nav nav-fill font-weight-bold">
						<li class="nav-item"><a class="nav-link text-white" href="#">팬션소개</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">객실보기</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">예약하기</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">예약목록</a></li>
					</ul>
				</div>
			</nav>
			<h3 class="text-center">예약 목록 보기</h3>
			<table class="table text-center">
				<thead>
					<tr>
						<th>이름</th>
						<th>예약날짜</th>
						<th>숙박일수</th>
						<th>숙박인원</th>
						<th>전화번호</th>
						<th>예약상태</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="booking:${bookingList}">
						<td th:text="${booking.name}"></td>
						<td th:text="${#temporals.format(booking.date, 'yyyy년 M월 d일')}"></td>
						<td th:text="${booking.day}"></td>
						<td th:text="${booking.headcount}"></td>
						<td th:text="${booking.phoneNumber}"></td>
						<td th:switch="${booking.state}">
							<h5 th:case="대기중" class="text-primary">대기중</h5>
							<h5 th:case="확정" class="text-success">확정</h5>
						</td>
						<td><button type="button" th:value="${booking.id}" class="btn btn-danger btn-sm delete-btn">삭제</button></td>
					</tr>
				</tbody>
			</table>
		</section>

		<footer>

			<div class="justify-contents-start small text-secondary">
				제주특별차치도 제주시 애월읍 <br> 사업자등록번호:111-22-255222/농어촌민박사업지정/대표:김통목<br>
				Copyright2025tongnamu All right reserved<br>
			</div>

		</footer>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.js"></script>

	<script>
		$(".delete-btn").on("click", function() {
			let id = $(this).val();
			let button = $(this); 

			$.ajax({
				type : "get",
				url : "/ajax/booking/delete",
				data : {
					"id" : id
				},
				success : function(response) {
					if (response.result === "success") {
						location.reload();

					} else {
						alert("삭제 실패");
					}
				},
				error : function() {
					alert("삭제 에러");
				}
			});
		});
	</script>
</body>
</html>
