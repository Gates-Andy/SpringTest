<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>통나무 팬션</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
<style>
#wrap {
	width: 1200px;
	margin: 0 auto;
}

header {
	height: 100px;
}

nav {
	height: 50px;
	background-color: peru;
}

section {
	height: 300px;
}

.contents {
	background-color: sienna;
}

.logIn {
	background-color: chocolate;
}

.contact {
	background-color: sienna;
}

footer {
	height: 100px;
}
</style>
</head>

<body>
	<div id="wrap">
		<header class="d-flex justify-content-center align-items-center">
			<div class="display-4">통나무 팬션</div>
		</header>

		<nav>
			<ul class="nav nav-fill">
				<li class="nav-item"><a href="#" class="nav-link text-dark">팬션소개</a></li>
				<li class="nav-item"><a href="#" class="nav-link text-dark">객실보기</a></li>
				<li class="nav-item"><a href="#" class="nav-link text-dark">예약안내</a></li>
				<li class="nav-item"><a href="#" class="nav-link text-dark">커뮤니티</a></li>
			</ul>
		</nav>

		<img
			src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner1.jpg"
			alt="펜션 사진" width="1200" height="450">

		<section class="main-contents d-flex">
			<div
				class="contents col-4 display-4 d-flex justify-content-center align-items-center text-white">
				실시간 <br> 예약 하기
			</div>

			<div class="logIn col-4 text-white">
				<div class="mt-3 d-flex align-items-center">
					<h5>예약 확인</h5>
					<label class="ml-3">회원</label><input type="radio" name="checkBtn"
						id="member" checked> <label class="ml-2">비회원</label><input
						type="radio" name="checkBtn" id="noneMember">
				</div>

				<div id="toHide" class="mt-3">
					<div class="d-flex align-items-center">
						<label class="col-3 text-right">아이디</label><input type="text"
							class="form-control" id="idInput">
					</div>
					<div class="d-flex align-items-center mt-2">
						<label class="col-3 text-right">비밀번호</label><input type="password"
							class="form-control" id="passWordInput">
					</div>
				</div>

				<div class="d-none" id="toShow">
					<div class="d-flex align-items-center mt-3">
						<label class="col-3 text-right">이름</label><input type="text"
							class="form-control" id="nameInput">
					</div>
					<div class="d-flex align-items-center mt-3">
						<label class="col-3 text-right">전화번호</label><input type="text"
							class="form-control" id="phoneNumberInput">
					</div>
					<div class="d-flex align-items-center mt-3">
						<label class="col-3 text-right">날짜</label><input type="text"
							class="form-control" id="dateSelect">
					</div>
				</div>

				<div class="mt-2 d-flex justify-content-end">
					<button type="button" class="bg-success text-white" id="searchBtn">조회하기</button>
				</div>
			</div>

			<div
				class="contact col-4 d-flex justify-content-center align-items-center text-white">
				<div class="text-center">
					<h3>예약문의 :</h3>
					<h1>010-000-1111</h1>
				</div>
			</div>
		</section>

		<footer class="text-secondary mt-3">
			<div class="small">
				제주특별차치도 제주시 애월읍<br> 사업자등록번호:111-22-255222 / 농어촌민박사업지정 / 대표:김통목<br>
				Copyright 2025 tongnamu All right reserved
			</div>
		</footer>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
		crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>

	<script>
		$("#noneMember").on("click", function() {
			$("#toShow").removeClass("d-none");
			$("#toHide").addClass("d-none");
		});

		$("#member").on("click", function() {
			$("#toHide").removeClass("d-none");
			$("#toShow").addClass("d-none");
		});

		$(function() {
			$.datepicker.setDefaults({
				closeText : "닫기",
				currentText : "오늘",
				prevText : '이전 달',
				nextText : '다음 달',
				monthNames : [ '1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월',
						'9월', '10월', '11월', '12월' ],
				monthNamesShort : [ '1월', '2월', '3월', '4월', '5월', '6월', '7월',
						'8월', '9월', '10월', '11월', '12월' ],
				dayNamesMin : [ '일', '월', '화', '수', '목', '금', '토' ],
				weekHeader : "주",
				yearSuffix : '년'
			});

			$("#dateSelect").datepicker({
				minDate : 0,
				dateFormat : "yy년mm월dd일",
			});
		});

		$("#searchBtn").on("click", function() {
			// 여기에 조회 처리 로직을 작성하면 됩니다.
			alert("조회 버튼이 클릭되었습니다.");
		});
	</script>
</body>

</html>
