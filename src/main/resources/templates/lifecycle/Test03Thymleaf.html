<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thymleaf 연동 html 화면</title>
</head>
<body>
	<h1>리스트 기억 나시죠?</h1>

	<h2>나의 최애 메뉴!</h2>

	<ul>
		<li th:each="menu : ${menus}" th:text="${menu}"></li>
	</ul>
	
	<!-- th:each="변수 : ${컬렉션}" 
	이걸 해석하면:
	menus라는 리스트가 있고, 
	그 안의 각 요소를 menu라는 이름으로 
	하나씩 꺼내서 <li> 요소로 출력하겠다.
	-->

</body>
</html>
