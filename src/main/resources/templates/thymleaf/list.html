<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>기상청</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/thymleaf/stylesheet1.css">
</head>
<body>
	<div id="wrap">
		<header> </header>

		<section class="contents d-flex">

			<nav class="main-menu bg-primary">
				<div class="justify-content-center mt-3">
					<img width="100"
						src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Korea_Meteorological_Administration_Logo_%28vertical%29.svg/512px-Korea_Meteorological_Administration_Logo_%28vertical%29.svg.png">
					<ul class="nav flex-column font-weight-bold">
						<li class="nav-item"><a class="nav-link text-white" href="#">날씨</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">날씨입력</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">테마날씨</a></li>
						<li class="nav-item"><a class="nav-link text-white" href="#">관측
								기후</a></li>
					</ul>
				</div>
			</nav>

			<article class="main-contents">
				<h3>과거 날씨</h3>
				<table class="table text-center">
					<thead>
						<tr>
							<th>날씨</th>
							<th>날짜</th>
							<th>기온</th>
							<th>강수량</th>
							<th>미세먼지</th>
							<th>풍속</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="weather : ${weatherHistory}">
						
							<td th:switch="${weather.weather}">
							
							<img th:case="'맑음'" src="http://marondal.com/material/images/dulumary/web/jstl/sunny.jpg" alt="맑음" width="50" /> 
							<img th:case="'구름조금'" src="http://marondal.com/material/images/dulumary/web/jstl/partlyCloudy.jpg" alt="구름조금" width="50" /> 
							<img th:case="'흐림'" src="http://marondal.com/material/images/dulumary/web/jstl/cloudy.jpg" alt="흐림" width="50" /> 
							<img th:case="'비'" src="http://marondal.com/material/images/dulumary/web/jstl/rainy.jpg" alt="비" width="50" /> 
							
							</td>
							<td th:text="${weather.date}">날짜</td>
							<td th:text="${weather.temperatures} + ' °C'">기온</td>
    						<td th:text="${weather.precipitation} + ' mm'">강수량</td>
							<td th:text="${weather.microDust}">미세먼지</td>
							<td th:text="${weather.windSpeed} + ' km/h'">풍속</td>
						</tr>
					</tbody>

				</table>
			</article>

		</section>


		<footer>
			<div class="d-flex">
				<img width="50"
					src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Korea_Meteorological_Administration_Logo_%28vertical%29.svg/512px-Korea_Meteorological_Administration_Logo_%28vertical%29.svg.png">
				(07062)서울시 동작구 여의대방로 16길 61 <br> Copyright@2020 KMA. ALL RIGHTS
				RESERVED.
			</div>
		</footer>


	</div>
</body>
</html>
